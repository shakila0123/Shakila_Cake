<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasbor Admin - Shakila Cake</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 15px 30px;">
        <h1>Dasbor Admin Shakila Cake</h1>
        <button id="btn-logout" class="btn-order hidden" style="background:#e74c3c; width:auto; padding: 8px 16px;">Logout</button>
    </header>

    <main>
        <p id="admin-access-error" class="form-error" role="alert" aria-live="assertive"></p>
        <section id="dashboard-section" class="hidden">
            <h2 id="product-form-heading">Tambah Produk Baru</h2>
            <form id="add-product-form">
                <input id="prod-id" type="hidden">
                <label for="prod-name">Nama produk</label>
                <input type="text" id="prod-name" placeholder="Nama Produk" minlength="3" maxlength="100" required>
                <label for="prod-category">Kategori</label>
                <select id="prod-category" required>
                    <option value="Kue Ulang Tahun">Kue Ulang Tahun</option>
                    <option value="Bolu Gulung">Bolu Gulung</option>
                    <option value="Brownies">Brownies</option>
                    <option value="Pie Buah">Pie Buah</option>
                    <option value="Bolu">Bolu</option>
                </select>
                <label for="prod-price">Harga dasar (rupiah)</label>
                <input type="number" id="prod-price" placeholder="Contoh: 150000" min="1" step="1" required>
                <label for="prod-image">Foto produk (JPEG, PNG, atau WEBP; maksimal 5 MB)</label>
                <input type="file" id="prod-image" accept="image/jpeg,image/png,image/webp">
                <img id="prod-image-preview" alt="Pratinjau foto produk" hidden style="max-width:100%; max-height:220px; object-fit:contain; border-radius:8px;">
                <p id="upload-status" role="status" aria-live="polite"></p>
                <label for="prod-desc">Deskripsi produk</label>
                <textarea id="prod-desc" placeholder="Deskripsi Singkat" maxlength="500" required></textarea>
                <p id="product-error" class="form-error" role="alert" aria-live="assertive"></p>
                <button type="submit" class="btn-order">Simpan Produk</button>
                <button id="cancel-product-edit" type="button" class="btn-secondary hidden">Batal Edit</button>
            </form>

            <h2 style="margin-top:30px;">Daftar Produk</h2>
            <div id="admin-product-list" class="product-grid" aria-live="polite"></div>

            <h2 style="margin-top:30px;">Rekap Pesanan</h2>
            <p>Pesanan yang dicatat saat checkout, diurutkan berdasarkan jadwal pengambilan.</p>
            <div id="admin-order-list" class="order-list" aria-live="polite"></div>
        </section>
    </main>
<script type="module" src="JS/admin.js"></script>
</body>
</html>
