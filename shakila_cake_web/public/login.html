<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Shakila Cake</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <header>
        <h1>Login Admin Shakila Cake</h1>
    </header>

    <main>
        <section id="login-section" style="max-width: 400px; margin: 40px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
            <h2 style="margin-bottom: 15px; text-align: center;">Masuk ke Dasbor</h2>
            <form id="login-form" style="display: flex; flex-direction: column; gap: 15px;">
                <input type="email" id="admin-email" placeholder="Email Admin" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px;" required>
                <input type="password" id="admin-password" placeholder="Password" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px;" required>
                <button type="submit" class="btn-order">Masuk</button>
            </form>
        </section>
    </main>

    <script type="module" src="JS/login.js"></script>
</body>
</html>
