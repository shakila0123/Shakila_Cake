<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shakila Cake - Katalog Digital</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <header>
        <h1>Shakila Cake</h1>
        <p>Katalog Digital & Pemesanan</p>
    </header>

    <main>
        <section class="filters">
            <button class="filter-btn active" data-category="all">Semua</button>
            <button class="filter-btn" data-category="Kue Ulang Tahun">Kue Ulang Tahun</button>
            <button class="filter-btn" data-category="Bolu Gulung">Bolu Gulung</button>
            <button class="filter-btn" data-category="Brownies">Brownies</button>
            <button class="filter-btn" data-category="Pie buah">Pie Buah</button>
        </section>

        <section id="product-list" class="product-grid">
            <!-- Produk akan dimuat melalui JavaScript -->
            <p>Memuat produk...</p>
        </section>
    </main>

    <!-- Modal Form Pemesanan -->
    <div id="order-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Form Pesanan</h2>
            <form id="order-form">
                <input type="hidden" id="product-name">
                
                <label>Nama Pemesan:</label>
                <input type="text" id="customer-name" required>
                
                <label>Tanggal Pengambilan/Pengiriman:</label>
                <input type="date" id="order-date" required>
                
                <label>Varian Rasa / Ukuran:</label>
                <input type="text" id="order-variant" placeholder="Cth: Coklat, Ukuran 20cm" required>
                
                <label>Tulisan di atas Kue (Opsional):</label>
                <textarea id="order-text" rows="2" placeholder="Cth: Happy Birthday Budi"></textarea>
                
                <button type="submit" class="btn-wa">Pesan via WhatsApp</button>
            </form>
        </div>
    </div>
    <button class="btn-request-float" onclick="requestCustomWA()">
       Request atau tanya-tanya
    </button>

    <script type="module" src="JS/app.js"></script>
</body>
</html>
