<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shakila Cake - Katalog Digital</title>
    <link rel="stylesheet" href="CSS/style.css">

</head>
<body>
    <header>
        <h1>Shakila Cake</h1>
        <p>Katalog Digital & Pemesanan</p>
        <a class="header-link" href="login.html">Login Admin</a>
    </header>

    <main>
        <label class="search-label" for="catalog-search">Cari produk</label>
        <input id="catalog-search" type="search" placeholder="Cari nama kue..." autocomplete="off">
        <section class="filters">
            <button class="filter-btn active" data-category="ALL">Semua</button>
            <button class="filter-btn" data-category="Kue Ulang Tahun">Kue Ulang Tahun</button>
            <button class="filter-btn" data-category="Bolu Gulung">Bolu Gulung</button>
            <button class="filter-btn" data-category="Brownies">Brownies</button>
            <button class="filter-btn" data-category="Pie Buah">Pie Buah</button>
            <button class="filter-btn" data-category="Bolu">Bolu</button>
        </section>

        <section id="product-list" class="product-grid" aria-live="polite">
            <!-- Produk akan dimuat melalui JavaScript -->
            <p>Memuat produk...</p>
        </section>
    </main>

    <!-- Modal Form Pemesanan -->
    <div id="order-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Form Pesanan</h2>
            <form id="order-form">
                <input type="hidden" id="product-id">
                <input type="hidden" id="product-name">
                <p id="order-product-price" class="price"></p>
                <p id="order-total" class="price" aria-live="polite"></p>
                <label for="customer-name">Nama Pemesan</label>
                <input type="text" id="customer-name" minlength="2" maxlength="80" autocomplete="name" required>
                <label for="order-flavor">Varian rasa</label>
                <input type="text" id="order-flavor" maxlength="60" placeholder="Contoh: cokelat" required>
                <label for="order-size">Ukuran kue</label>
                <select id="order-size" required>
                    <option value="16cm">16 cm (standar)</option>
                    <option value="20cm">20 cm (+35%)</option>
                    <option value="24cm">24 cm (+75%)</option>
                </select>
                <label for="order-candles">Lilin angka (opsional)</label>
                <input type="number" id="order-candles" min="0" max="20" step="1" value="0">
                <label for="order-date">Tanggal dan jam pengambilan (minimal H-2, pukul 08.00-18.00)</label>
                <input type="datetime-local" id="order-date" required>
                <label for="order-text">Tulisan di atas kue (maksimal 35 karakter)</label>
                <textarea id="order-text" rows="2" maxlength="35" placeholder="Contoh: Selamat Ulang Tahun"></textarea>
                <p id="order-error" class="form-error" role="alert" aria-live="assertive"></p>
                <button type="submit" class="btn-wa">Simpan & lanjut ke WhatsApp</button>
            </form>
        </div>
    </div>
    <button id="request-wa" class="btn-request-float" type="button">
       Request atau tanya-tanya
    </button>

    <script type="module" src="JS/app.js"></script>
</body>
</html>
